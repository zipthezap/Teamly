server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse-proxy ────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend container.
    # Buffering and caching are disabled so that Server-Sent Events (SSE) used
    # by the notifications stream work correctly.
    location /api/ {
        proxy_pass          http://backend:3000/api/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        '';
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Required for SSE / long-lived connections.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  24h;
    }

    # ── Flutter web app ───────────────────────────────────────────────────────
    # go_router uses the HTML5 History API for client-side navigation, so every
    # unknown path must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent browsers from caching index.html so service-worker updates
        # are picked up immediately.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets compiled by Flutter can be cached aggressively because they
    # include content hashes in their filenames.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
