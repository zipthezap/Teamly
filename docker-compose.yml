services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
      - "3443:3443"  # HTTPS port
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/teamly?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
      # SECURITY: Set a strong JWT secret via environment variable in production
      # Generate with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-please-change-this-in-production-to-a-random-secure-value}
      # HTTPS Configuration (optional)
      # Set USE_HTTPS=true and mount SSL certificates to enable HTTPS
      USE_HTTPS: ${USE_HTTPS:-false}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/ssl/privkey.pem}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/ssl/fullchain.pem}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
    volumes:
      - uploads_data:/app/uploads
      # Uncomment to mount SSL certificates for HTTPS
      # - ./ssl:/app/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && node prisma/seed.js && npm start"

  # Flutter web application served by nginx.
  # The nginx config (nginx/flutter-web.conf) proxies /api/* requests to the
  # backend container so that both the app UI and the API share the same origin
  # – no CORS configuration is needed for the browser.
  #
  # The Flutter app is compiled at image-build time with dart-define constants.
  # Set FLUTTER_API_BASE_URL in a .env file if you expose the stack on a
  # non-default address; defaults to http://localhost:8080/api.
  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile.flutter-web
      args:
        API_BASE_URL: ${FLUTTER_API_BASE_URL:-http://localhost:8080/api}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        APP_ENV: development
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
