services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
      - "3443:3443"  # HTTPS port
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/teamly?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
      # SECURITY: Set a strong JWT secret via environment variable in production
      # Generate with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-please-change-this-in-production-to-a-random-secure-value}
      # HTTPS Configuration (optional)
      # Set USE_HTTPS=true and mount SSL certificates to enable HTTPS
      USE_HTTPS: ${USE_HTTPS:-false}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/ssl/privkey.pem}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/ssl/fullchain.pem}
    volumes:
      - uploads_data:/app/uploads
      # Uncomment to mount SSL certificates for HTTPS
      # - ./ssl:/app/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma generate && node prisma/seed.js && npm start"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "80:80"
      - "443:443"  # HTTPS port
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
      NODE_ENV: development
    # Uncomment to mount SSL certificates for HTTPS
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro
      

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:3001"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
      NODE_ENV: development

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
      args:
        VITE_API_URL: http://192.168.0.212:3000/api
    ports:
      - "5173:3001"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://192.168.0.212:3000/api
      NODE_ENV: development

volumes:
  postgres_data:
  redis_data:
  uploads_data:
