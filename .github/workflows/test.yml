name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/backend/**'
      - 'package.json'
      - 'vitest.config.ts'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/backend/**'
      - 'package.json'
      - 'vitest.config.ts'

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
