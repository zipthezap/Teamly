name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY_NAME: ${{ secrets.AZURE_REGISTRY_NAME }}
  BACKEND_APP_NAME: ${{ secrets.AZURE_BACKEND_WEBAPP_NAME }}
  FRONTEND_APP_NAME: ${{ secrets.AZURE_FRONTEND_WEBAPP_NAME }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.backend \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-backend:${{ github.sha }} \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-backend:latest \
            .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-backend:latest

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.BACKEND_APP_NAME }}
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-backend:${{ github.sha }}

      - name: Run database migrations
        run: |
          # Wait for container to be ready (check health endpoint)
          echo "Waiting for backend to be ready..."
          for i in {1..20}; do
            if curl -f -s "https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net/health" > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 10
          done
          
          # Run migrations using Azure CLI
          az webapp ssh \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.BACKEND_APP_NAME }} \
            --command "cd /app && npx prisma migrate deploy && npx prisma generate" || echo "Migration step failed or already completed"

      - name: Azure logout
        run: |
          az logout
        if: always()

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push frontend image
        run: |
          docker build -f Dockerfile.frontend \
            --build-arg VITE_API_URL=https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net/api \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-frontend:latest \
            .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-frontend:latest

      - name: Deploy frontend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/teamly-frontend:${{ github.sha }}

      - name: Azure logout
        run: |
          az logout
        if: always()

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [build-and-deploy-backend, build-and-deploy-frontend]
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.build-and-deploy-backend.result }}" == "success" ] && [ "${{ needs.build-and-deploy-frontend.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "Frontend: https://${{ env.FRONTEND_APP_NAME }}.azurewebsites.net"
            echo "Backend: https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net"
          else
            echo "❌ Deployment failed. Check the logs above."
            exit 1
          fi
